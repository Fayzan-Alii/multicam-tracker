[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multicam-tracker"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
multicam-tracker = "multicam_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
